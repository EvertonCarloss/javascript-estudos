<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
</head>

<body>

  <!-- Titulo -->
  <h1>Lista de Tarefas</h1>

  <!-- Formulário -->
  <form id="formTarefa">
    <input type="text" id="inTarefa" placeholder="Digite uma tarefa">
    <input type="submit" value="Adicionar">
  </form>

  <!-- Área de saída -->
  <p id="saidaErro"></p>
  <ul id="listaTarefas"></ul>
  <p id="saidaTotal"></p>

  <!-- Ligação com o Js e fechamento -->
  <script src="script.js"></script>
</body>

</html>
